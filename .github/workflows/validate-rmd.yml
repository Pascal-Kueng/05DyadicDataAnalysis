name: Validate R Markdown sources

on:
  push:
    paths:
      - "**/*.R"
      - "**/*.Rmd"
      - "renv.lock"
      - ".github/workflows/validate-rmd.yml"
  pull_request:
    paths:
      - "**/*.R"
      - "**/*.Rmd"
      - "renv.lock"
      - ".github/workflows/validate-rmd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install validator dependency
        shell: Rscript {0}
        run: install.packages("knitr")

      - name: Validate R Markdown sources
        run: Rscript scripts/check-rmd.R
